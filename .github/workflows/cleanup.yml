name: Daily data cleanup

# Enforce five-day retention for batches, records, jobs, aggregates, insights,
# and retired revisions so the MongoDB Atlas free tier stays small. Calls the app's protected cleanup endpoint
# (POST /api/cron/cleanup) on a daily schedule.
#
# Runs once for each GitHub Environment listed in the matrix below. Each
# environment must define:
#   CLEANUP_URL  - environment variable containing the full deployed endpoint
#   CRON_SECRET  - environment secret matching the app's CRON_SECRET env var
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Don't pile up runs if a previous one is still going.
concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune stale data (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      # Always attempt cleanup for every environment, even if one fails.
      fail-fast: false
      matrix:
        environment:
          - production
          - dedicated
    environment: ${{ matrix.environment }}
    steps:
      - name: Call cleanup endpoint
        env:
          CLEANUP_URL: ${{ vars.CLEANUP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CLEANUP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CLEANUP_URL variable and CRON_SECRET secret must be set for ${{ matrix.environment }}."
            exit 1
          fi
          curl -fsS -X POST "$CLEANUP_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w '\nHTTP %{http_code}\n'
